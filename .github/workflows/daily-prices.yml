name: Log daily coffee prices

# The upstream feed only exposes a current snapshot, so genuine per-grade
# history has to be accumulated by recording it once a day.
on:
  schedule:
    # 06:15 UTC = 09:15 EAT, after the upstream feed's ~03:00 UTC refresh.
    - cron: "15 6 * * *"
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  log-prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Append today's snapshot
        # Run from src/ so the sibling-module imports resolve, matching how
        # the other fetch scripts are invoked.
        run: python log_daily_prices.py
        working-directory: src

      - name: Refresh the current-prices snapshot
        run: python fetch_uganda_prices.py
        working-directory: src

      - name: Rebuild the static dashboard
        # Static Spaces cannot run Python, so the page is generated here and
        # served as plain HTML.
        run: python build_static_site.py
        working-directory: src

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/uganda_grades_log.csv \
                  data/processed/uganda_grades_snapshot.csv \
                  index.html
          if git diff --cached --quiet; then
            echo "Nothing changed today; nothing to commit."
          else
            git commit -m "Update prices and rebuild dashboard for $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Publish to Hugging Face Space
        # Skipped automatically until an HF_TOKEN secret is added to the repo.
        # Only index.html and the Space README are pushed — a static Space
        # serves those two and ignores everything else.
        if: ${{ env.HF_TOKEN != '' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: The-Rookie/coffee_price_predictor
        run: |
          rm -rf hf-space
          git clone "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" hf-space
          cp index.html hf-space/index.html
          cp README_HF.md hf-space/README.md
          cd hf-space
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          if git diff --cached --quiet; then
            echo "Space already up to date."
          else
            git commit -m "Update dashboard for $(date -u +%Y-%m-%d)"
            git push
          fi
